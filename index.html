<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인스타 여백 채우기</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="인스타 여백">
<meta name="theme-color" content="#f2f3f5">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f2f3f5; --panel:#ffffff; --ink:#17181c; --muted:#6b6f78; --line:#dcdfe5;
  --accent:#1e5bff; --accent-ink:#ffffff; --check:#e6e8ec;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16171a; --panel:#1f2024; --ink:#f0f1f3; --muted:#9a9ea8; --line:#33353b;
    --accent:#5b8cff; --accent-ink:#0b0d12; --check:#2a2c31;
  }
}
:root[data-theme="dark"]{
  --bg:#16171a; --panel:#1f2024; --ink:#f0f1f3; --muted:#9a9ea8; --line:#33353b;
  --accent:#5b8cff; --accent-ink:#0b0d12; --check:#2a2c31;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.55}
main{max-width:960px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:26px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 24px;max-width:560px}

.drop{display:block;width:100%;border:2px dashed var(--line);border-radius:14px;background:var(--panel);padding:36px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent)}
.drop strong{display:block;font-size:17px;font-weight:500}
.drop span{color:var(--muted);font-size:14px}
.drop input{display:none}

.controls{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;margin:22px 0 10px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--ink);padding:12px 16px;font:inherit;font-size:14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.colorrow{display:flex;align-items:center;gap:8px}
.swatch{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);padding:0;background:none;cursor:pointer}
.swatch input{width:100%;height:100%;border:0;padding:0;background:none;cursor:pointer}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;padding-bottom:8px}
.check input{width:16px;height:16px;accent-color:var(--accent)}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 26px}
.btn{border:0;border-radius:10px;padding:14px 20px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card .thumb{background:
  linear-gradient(45deg,var(--check) 25%,transparent 25%,transparent 75%,var(--check) 75%),
  linear-gradient(45deg,var(--check) 25%,transparent 25%,transparent 75%,var(--check) 75%);
  background-size:16px 16px;background-position:0 0,8px 8px;
  display:flex;align-items:center;justify-content:center;aspect-ratio:1;padding:10px}
.card img{max-width:100%;max-height:100%;box-shadow:0 1px 3px rgba(0,0,0,.25);display:block}
.hint{font-size:12px;color:var(--muted);padding:0 12px 10px}
.card .meta{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .size{font-size:12px;color:var(--muted);white-space:nowrap}
.card .dl{border:0;background:none;color:var(--accent);font:inherit;font-size:14px;font-weight:500;cursor:pointer;padding:10px 4px;white-space:nowrap}
.status{color:var(--muted);font-size:14px;min-height:1.5em;margin-bottom:10px}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.tabs{display:flex;gap:6px;margin:0 0 18px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-size:15px;font-weight:500;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel[hidden]{display:none}
.vwrap{display:grid;gap:14px;margin-top:18px}
.vprev{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;justify-content:center}
.vprev canvas,.vprev video{max-width:100%;max-height:60vh;border-radius:6px;display:block}
.bar{height:8px;background:var(--check);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.note{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>인스타 여백 채우기</h1>
  <p class="lead">가로 사진의 양옆이 잘리지 않도록, 인스타그램 비율에 맞춰 위아래에 배경색을 채워 줍니다. 사진은 브라우저 안에서만 처리되고 어디에도 업로드되지 않아요. iPhone에서는 결과 이미지를 길게 눌러 사진 앱에 저장할 수도 있어요.</p>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" aria-selected="true" data-tab="photo">사진</button>
    <button type="button" role="tab" aria-selected="false" data-tab="video">동영상</button>
  </div>

  <section class="panel" id="panel-photo">
  <label class="drop" id="drop">
    <strong>사진을 여기에 끌어다 놓거나 눌러서 선택</strong>
    <span>JPG · PNG · WebP, 여러 장 한 번에 가능</span>
    <input type="file" id="file" accept="image/*" multiple>
  </label>

  <div class="controls">
    <div class="field">
      <label>목표 비율</label>
      <div class="seg" id="ratioSeg" role="group" aria-label="목표 비율">
        <button type="button" data-r="0.8" aria-pressed="true">4:5 세로</button>
        <button type="button" data-r="1">1:1 정사각</button>
        <button type="button" data-r="1.91">1.91:1 가로</button>
      </div>
    </div>
    <div class="field">
      <label>배경색</label>
      <div class="colorrow">
        <div class="swatch"><input type="color" id="color" value="#ffffff" aria-label="배경색 선택"></div>
        <button type="button" class="chip" data-c="#ffffff" aria-pressed="true">흰색</button>
        <button type="button" class="chip" data-c="#000000">검정</button>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="resize" checked> 가로 1080px로 맞추기 (인스타 권장)</label>
    <div class="field">
      <label>저장 형식</label>
      <div class="seg" id="fmtSeg" role="group" aria-label="저장 형식">
        <button type="button" data-f="jpg" aria-pressed="true">JPG</button>
        <button type="button" data-f="png">PNG</button>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn primary" id="dlAll" disabled>전체 저장</button>
    <button class="btn" id="clear" disabled>모두 지우기</button>
  </div>
  <div class="status" id="status"></div>

  <div class="grid" id="grid"><div class="empty">아직 사진이 없어요. 위에서 사진을 추가해 보세요.</div></div>
  </section>

  <section class="panel" id="panel-video" hidden>
    <label class="drop" id="vdrop">
      <strong>동영상을 눌러서 선택 (여러 개 가능)</strong>
      <span>iPhone Safari 기준 · 1~2분 이내 영상 권장</span>
      <input type="file" id="vfile" accept="video/*" multiple>
    </label>

    <div class="controls">
      <div class="field">
        <label>목표 비율</label>
        <div class="seg" id="vratioSeg" role="group" aria-label="동영상 목표 비율">
          <button type="button" data-r="0.8" aria-pressed="true">4:5 세로</button>
          <button type="button" data-r="1">1:1 정사각</button>
          <button type="button" data-r="0.5625">9:16 릴스</button>
        </div>
      </div>
      <div class="field">
        <label>배경색</label>
        <div class="colorrow">
          <div class="swatch"><input type="color" id="vcolor" value="#ffffff" aria-label="동영상 배경색"></div>
          <button type="button" class="vchip chip" data-c="#ffffff" aria-pressed="true">흰색</button>
          <button type="button" class="vchip chip" data-c="#000000">검정</button>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="vaudio" checked> 소리 유지</label>
    </div>

    <div class="actions">
      <button class="btn primary" id="vstart" disabled>변환 시작</button>
      <button class="btn" id="vsave" disabled>완료된 영상 모두 저장</button>
    </div>
    <div class="bar"><i id="vbar"></i></div>
    <div class="status" id="vstatus"></div>
    <p class="note">변환은 영상 길이만큼 걸리고, 진행 중에는 화면을 끄거나 다른 앱으로 나가지 마세요. 결과는 mp4로 만들어져 공유 시트의 "비디오 저장"으로 사진 앱에 넣을 수 있어요.</p>

    <div class="vwrap">
      <div class="vprev" id="vprev" hidden><canvas id="vcanvas"></canvas></div>
      <div class="grid" id="vgrid"></div>
      <video id="vsrc" playsinline hidden></video>
    </div>
  </section>
</main>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const state = { ratio: 0.8, color: '#ffffff', resize: true, fmt: 'jpg', items: [] };
  const downloads = {
    save: async ({ filename, data }) => {
      const type = filename.endsWith('.png') ? 'image/png' : 'image/jpeg';
      const file = new File([data], filename, { type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); return { status: 'saved' }; }
        catch (e) { if (e && e.name === 'AbortError') throw { code: 'declined' }; }
      }
      const dataUrl = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(data); });
      const a = document.createElement('a');
      a.href = dataUrl; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      return { status: 'saved' };
    }
  };

  const grid = $('#grid'), status = $('#status');

  function setStatus(t){ status.textContent = t || ''; }

  function refreshButtons(){
    const has = state.items.length > 0;
    $('#dlAll').disabled = !has || !downloads;
    $('#clear').disabled = !has;
    document.querySelectorAll('.dl').forEach(b => b.disabled = !downloads);
    if (has) setStatus(`${state.items.length}장 준비됨`);
    else setStatus('');
  }

  function render(item){
    const img = item.img, r = state.ratio;
    let w = img.naturalWidth, h = img.naturalHeight;
    if (state.resize && w > 1080) { h = Math.round(h * 1080 / w); w = 1080; }
    let cw, ch;
    if (w / h > r) { cw = w; ch = Math.round(w / r); } else { ch = h; cw = Math.round(h * r); }
    const c = item.canvas; c.width = cw; c.height = ch;
    const ctx = c.getContext('2d');
    ctx.fillStyle = state.color; ctx.fillRect(0, 0, cw, ch);
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, Math.round((cw - w) / 2), Math.round((ch - h) / 2), w, h);
    item.sizeEl.textContent = `${cw} × ${ch}`;
    item.out.src = c.toDataURL(state.fmt === 'png' ? 'image/png' : 'image/jpeg', 0.95);
  }
  function renderAll(){ state.items.forEach(render); }

  function outName(item){
    const base = item.name.replace(/\.[^.]+$/, '');
    return `${base}_insta.${state.fmt}`;
  }
  function toBlob(canvas){
    return new Promise(res => canvas.toBlob(res, state.fmt === 'png' ? 'image/png' : 'image/jpeg', 0.95));
  }
  async function save(item){
    if (!downloads) return;
    try {
      const blob = await toBlob(item.canvas);
      await downloads.save({ filename: outName(item), data: blob });
      setStatus(`${outName(item)} 저장됨`);
    } catch (e) {
      if (e && e.code === 'declined') setStatus('저장을 취소했어요.');
      else if (e && e.code === 'rate_limited') setStatus('잠시 후 다시 시도해 주세요.');
      else setStatus('저장하지 못했어요. 다시 시도해 주세요.');
    }
  }

  function addFiles(files){
    const isImg = f => f.type.startsWith('image/') || /\.(jpe?g|png|webp|gif|heic|heif)$/i.test(f.name);
    const list = [...files].filter(isImg);
    if (!list.length) return;
    if (!state.items.length) grid.innerHTML = '';
    list.forEach(file => {
      const img = new Image();
      img.onload = () => {
        const card = document.createElement('div'); card.className = 'card';
        const thumb = document.createElement('div'); thumb.className = 'thumb';
        const canvas = document.createElement('canvas');
        const out = document.createElement('img'); out.alt = file.name;
        thumb.appendChild(out);
        const meta = document.createElement('div'); meta.className = 'meta';
        const left = document.createElement('div');
        const name = document.createElement('div'); name.className = 'name'; name.textContent = file.name;
        const size = document.createElement('div'); size.className = 'size';
        left.append(name, size);
        const dl = document.createElement('button'); dl.className = 'dl'; dl.type = 'button'; dl.textContent = '저장';
        meta.append(left, dl);
        const hint = document.createElement('div'); hint.className = 'hint'; hint.textContent = '이미지를 길게 눌러 사진에 저장할 수 있어요';
        card.append(thumb, meta, hint);
        grid.appendChild(card);
        const item = { name: file.name, img, canvas, out, sizeEl: size };
        dl.addEventListener('click', () => save(item));
        state.items.push(item);
        render(item);
        refreshButtons();
      };
      img.onerror = () => {
        if (/heic|heif/i.test(file.type + file.name)) setStatus(`${file.name}은(는) HEIC 형식이라 브라우저가 열 수 없어요. 사진 앱에서 "복제 → JPEG"로 바꾸거나, 설정 → 사진 → "Mac 또는 PC로 전송"을 "자동"으로 바꿔 주세요.`);
        else setStatus(`${file.name}을(를) 열지 못했어요. 다른 사진으로 다시 시도해 주세요.`);
      };
      const reader = new FileReader();
      reader.onload = () => { img.src = reader.result; };
      reader.onerror = () => setStatus(`${file.name}을(를) 읽지 못했어요.`);
      reader.readAsDataURL(file);
    });
  }

  // inputs
  const drop = $('#drop');
  $('#file').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
  document.addEventListener('paste', e => { if (e.clipboardData && e.clipboardData.files.length) addFiles(e.clipboardData.files); });

  function segSetup(id, attr, onPick){
    const seg = $(id);
    seg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
      onPick(b.dataset[attr]);
    }));
  }
  segSetup('#ratioSeg', 'r', v => { state.ratio = parseFloat(v); renderAll(); });
  segSetup('#fmtSeg', 'f', v => { state.fmt = v; renderAll(); });

  const colorInput = $('#color');
  function setColor(c){
    state.color = c; colorInput.value = c;
    document.querySelectorAll('.chip').forEach(ch => ch.setAttribute('aria-pressed', ch.dataset.c === c));
    renderAll();
  }
  colorInput.addEventListener('input', e => setColor(e.target.value));
  document.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => setColor(ch.dataset.c)));
  $('#resize').addEventListener('change', e => { state.resize = e.target.checked; renderAll(); });

  $('#dlAll').addEventListener('click', async () => {
    if (!state.items.length) return;
    const type = state.fmt === 'png' ? 'image/png' : 'image/jpeg';
    const files = [];
    for (const item of state.items) {
      const blob = await toBlob(item.canvas);
      files.push(new File([blob], outName(item), { type }));
    }
    if (navigator.canShare && navigator.canShare({ files })) {
      try { await navigator.share({ files }); setStatus(`${files.length}장을 공유 시트로 보냈어요. "이미지 저장"을 누르면 사진 앱에 들어가요.`); }
      catch (e) { if (e && e.name === 'AbortError') setStatus('저장을 취소했어요.'); else setStatus('공유에 실패했어요. 한 장씩 저장해 보세요.'); }
      return;
    }
    for (const item of state.items) { await save(item); await new Promise(r => setTimeout(r, 300)); }
  });
  $('#clear').addEventListener('click', () => {
    state.items = [];
    grid.innerHTML = '<div class="empty">아직 사진이 없어요. 위에서 사진을 추가해 보세요.</div>';
    refreshButtons();
  });

  // ---------- tabs ----------
  document.querySelectorAll('.tabs [role=tab]').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tabs [role=tab]').forEach(x => x.setAttribute('aria-selected', x === t));
    document.querySelectorAll('.panel').forEach(p => p.hidden = p.id !== 'panel-' + t.dataset.tab);
  }));

  // ---------- video ----------
  const V = { ratio: 0.8, color: '#ffffff', audio: true, queue: [], busy: false };
  const vsrc = $('#vsrc'), vcanvas = $('#vcanvas'), vprev = $('#vprev'), vbar = $('#vbar'), vstatus = $('#vstatus'), vgrid = $('#vgrid');
  const vset = t => vstatus.textContent = t || '';

  function pickMime(){
    const cands = ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    if (!window.MediaRecorder) return null;
    for (const c of cands) if (MediaRecorder.isTypeSupported(c)) return c;
    return null;
  }
  const doneItems = () => V.queue.filter(q => q.blob);
  function vButtons(){
    $('#vstart').disabled = V.busy || !V.queue.some(q => !q.blob && !q.failed);
    $('#vsave').disabled = V.busy || !doneItems().length;
  }

  $('#vfile').addEventListener('change', e => {
    const files = [...e.target.files]; e.target.value = '';
    if (!files.length) return;
    if (!pickMime()) { vset('이 브라우저는 영상 녹화를 지원하지 않아요. iPhone Safari에서 열어 주세요.'); return; }
    for (const f of files) {
      const card = document.createElement('div'); card.className = 'card';
      const meta = document.createElement('div'); meta.className = 'meta';
      const left = document.createElement('div');
      const name = document.createElement('div'); name.className = 'name'; name.textContent = f.name;
      const size = document.createElement('div'); size.className = 'size'; size.textContent = '대기 중';
      left.append(name, size);
      const dl = document.createElement('button'); dl.className = 'dl'; dl.type = 'button'; dl.textContent = '저장'; dl.disabled = true;
      meta.append(left, dl);
      const out = document.createElement('video'); out.playsInline = true; out.controls = true; out.hidden = true; out.style.maxWidth = '100%';
      card.append(out, meta); vgrid.appendChild(card);
      const q = { file: f, blob: null, ext: 'mp4', failed: false, sizeEl: size, dl, out };
      dl.addEventListener('click', () => shareVideos([q]));
      V.queue.push(q);
    }
    vset(`${V.queue.length}개 준비됨`); vButtons();
  });

  function vseg(id, attr, cb){ const s = $(id); s.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { s.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); cb(b.dataset[attr]); })); }
  vseg('#vratioSeg', 'r', v => V.ratio = parseFloat(v));
  const vcolor = $('#vcolor');
  function vsetColor(c){ V.color = c; vcolor.value = c; document.querySelectorAll('.vchip').forEach(ch => ch.setAttribute('aria-pressed', ch.dataset.c === c)); }
  vcolor.addEventListener('input', e => vsetColor(e.target.value));
  document.querySelectorAll('.vchip').forEach(ch => ch.addEventListener('click', () => vsetColor(ch.dataset.c)));
  $('#vaudio').addEventListener('change', e => V.audio = e.target.checked);

  function loadVideo(file){
    return new Promise((res, rej) => {
      vsrc.src = URL.createObjectURL(file); vsrc.muted = true; vsrc.load();
      vsrc.onloadedmetadata = () => res(); vsrc.onerror = () => rej(new Error('open'));
    });
  }

  async function convertOne(q, idx, total){
    const mime = pickMime();
    q.ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
    q.sizeEl.textContent = '변환 중…';
    await loadVideo(q.file);

    let w = vsrc.videoWidth, h = vsrc.videoHeight;
    if (w > 1080) { h = Math.round(h * 1080 / w); w = 1080; }
    let cw, ch; if (w / h > V.ratio) { cw = w; ch = Math.round(w / V.ratio); } else { ch = h; cw = Math.round(h * V.ratio); }
    cw -= cw % 2; ch -= ch % 2;
    vcanvas.width = cw; vcanvas.height = ch; vprev.hidden = false;
    const ctx = vcanvas.getContext('2d');
    const dx = Math.round((cw - w) / 2), dy = Math.round((ch - h) / 2);
    const paint = () => { ctx.fillStyle = V.color; ctx.fillRect(0, 0, cw, ch); ctx.drawImage(vsrc, dx, dy, w, h); };
    paint();

    const stream = vcanvas.captureStream(30);
    let actx = null;
    if (V.audio) {
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        await actx.resume();
        const srcNode = actx.createMediaElementSource(vsrc);
        const dest = actx.createMediaStreamDestination();
        srcNode.connect(dest);
        dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
        vsrc.muted = false; vsrc.volume = 1;
      } catch (e) { actx = null; }
    } else { vsrc.muted = true; }

    const chunks = [];
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    const done = new Promise(res => rec.onstop = res);
    let raf = 0;
    const tick = () => { paint(); const p = vsrc.duration ? vsrc.currentTime / vsrc.duration : 0; vbar.style.width = ((idx + p) / total * 100) + '%'; vset(`${idx + 1} / ${total}번째 변환 중… ${Math.round(vsrc.currentTime)} / ${Math.round(vsrc.duration)}초`); raf = requestAnimationFrame(tick); };

    vsrc.currentTime = 0;
    await new Promise(r => { if (vsrc.readyState >= 2) r(); else vsrc.oncanplay = r; });
    rec.start(1000); tick();
    await vsrc.play();
    await new Promise(r => vsrc.onended = r);
    cancelAnimationFrame(raf); paint();
    rec.stop(); await done;
    if (actx) { try { await actx.close(); } catch (e) {} }
    // release the element from the audio graph for the next file
    vsrc.removeAttribute('src'); vsrc.load();

    q.blob = new Blob(chunks, { type: mime.split(';')[0] });
    q.out.src = URL.createObjectURL(q.blob); q.out.hidden = false;
    q.sizeEl.textContent = `${(q.blob.size / 1048576).toFixed(1)} MB · ${q.ext.toUpperCase()}`;
    q.dl.disabled = false;
  }

  $('#vstart').addEventListener('click', async () => {
    if (V.busy) return;
    const todo = V.queue.filter(q => !q.blob && !q.failed);
    if (!todo.length) return;
    V.busy = true; vButtons();
    for (let i = 0; i < todo.length; i++) {
      try { await convertOne(todo[i], i, todo.length); }
      catch (e) { todo[i].failed = true; todo[i].sizeEl.textContent = '변환 실패'; }
    }
    vprev.hidden = true; vbar.style.width = '100%';
    V.busy = false; vButtons();
    const ok = doneItems().length;
    vset(`${ok}개 완료. "모두 저장"을 누르면 사진 앱으로 보낼 수 있어요.`);
  });

  async function shareVideos(items){
    const files = items.map(q => new File([q.blob], q.file.name.replace(/\.[^.]+$/, '') + '_insta.' + q.ext, { type: q.blob.type }));
    if (navigator.canShare && navigator.canShare({ files })) {
      try { await navigator.share({ files }); vset('공유 시트에서 "비디오 저장"을 누르면 사진 앱에 들어가요.'); return; }
      catch (e) { if (e && e.name === 'AbortError') { vset('저장을 취소했어요.'); return; } }
    }
    for (const q of items) { const a = document.createElement('a'); a.href = q.out.src; a.download = q.file.name.replace(/\.[^.]+$/, '') + '_insta.' + q.ext; document.body.appendChild(a); a.click(); a.remove(); await new Promise(r => setTimeout(r, 300)); }
  }
  $('#vsave').addEventListener('click', () => shareVideos(doneItems()));
})();
</script>
</body>
</html>
